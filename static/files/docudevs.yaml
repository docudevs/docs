      tags:
      - cases
      operationId: deleteCase
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: deleteCase 200 response
  /cases/{caseId}/documents:
    get:
      tags:
      - cases
      operationId: listCaseDocuments
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: true
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: true
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: listCaseDocuments 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page_CaseDocument_"
    post:
      tags:
      - cases
      operationId: uploadCaseDocument
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                document:
                  type: string
                  format: binary
                datasetType:
                  type:
                  - string
                  - "null"
              required:
              - document
            encoding:
              document:
                contentType: application/octet-stream
        required: true
      responses:
        "201":
          description: Document uploaded successfully
  /cases/{caseId}/documents/{documentId}:
    get:
      tags:
      - cases
      operationId: getCaseDocument
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: documentId
        in: path
        required: true
        schema:
          type: string
      responses:
