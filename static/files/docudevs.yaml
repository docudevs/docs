        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: documentId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: deleteCaseDocument 200 response
  /cases/{caseId}/documents/{documentId}/download:
