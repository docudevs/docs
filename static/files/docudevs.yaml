openapi: 3.1.0
info:
  title: DocuDevs API
  description: DocuDevs Document processing API. Easiest way to convert your documents to data
  version: 1.3.0
paths:
  /agent/chat:
    post:
      tags:
      - agent
      operationId: chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentChatRequest"
        required: true
      responses:
        "200":
          description: chat 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentChatResponse"
  /agent/status/{jobGuid}:
    get:
      tags:
      - agent
      operationId: getAgentStatus
      parameters:
      - name: jobGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: getAgentStatus 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatusResponse"
  /cases:
    get:
      tags:
      - cases
      operationId: listCases
      responses:
        "200":
          description: listCases 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Case"
    post:
      tags:
      - cases
      operationId: createCase
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasesController.CreateCaseRequest"
        required: true
      responses:
        "201":
          description: Case created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
  /cases/{caseId}:
    get:
      tags:
      - cases
      operationId: getCase
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: getCase 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
    put:
      tags:
      - cases
      operationId: updateCase
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasesController.UpdateCaseRequest"
        required: true
      responses:
        "200":
          description: updateCase 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
