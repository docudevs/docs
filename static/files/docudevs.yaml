openapi: 3.1.0
info:
  title: DocuDevs API
  description: DocuDevs Document processing API. Easiest way to convert your documents to data
  version: 1.3.0
paths:
  /agent/actions/{id}:
    get:
      tags:
      - agent
      summary: Get an agent action with the request it would run
      operationId: getAgentAction
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Action not found
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingActionResponse"
  /agent/actions/{id}/confirm:
    post:
      tags:
      - agent
      summary: Confirm an agent action (human only)
      description: "Replays the stored request with the confirming person's own credentials.\
        \ Idempotent: a repeated confirm returns the stored result without replaying.\
        \ Only the person the agent acted for can confirm. Agent tokens are refused."
      operationId: confirmAgentAction
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "403":
          description: "Agent token, or the action belongs to another user"
        "404":
          description: Action not found
        "409":
          description: "The action expired, was rejected, is being confirmed, or its\
            \ stored request failed verification"
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingActionResponse"
  /agent/actions/{id}/reject:
    post:
      tags:
      - agent
      summary: Reject an agent action (human only)
      operationId: rejectAgentAction
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectAgentActionRequest"
        required: false
      responses:
        "403":
          description: "Agent token, or the action belongs to another user"
        "404":
          description: Action not found
        "409":
          description: "The action was confirmed, expired or is being confirmed"
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingActionResponse"
  /agent/chat:
    post:
      tags:
      - agent
      operationId: chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentChatRequest"
        required: true
      responses:
        "200":
          description: chat 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentChatResponse"
  /agent/status/{jobGuid}:
    get:
      tags:
      - agent
      operationId: getAgentStatus
      parameters:
      - name: jobGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: getAgentStatus 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatusResponse"
  /cases:
    get:
      tags:
      - cases
      operationId: listCases
      responses:
        "200":
          description: listCases 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Case"
    post:
      tags:
      - cases
      operationId: createCase
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasesController.CreateCaseRequest"
        required: true
      responses:
        "201":
          description: Case created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
  /cases/{caseId}:
    get:
      tags:
      - cases
      operationId: getCase
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: getCase 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
    put:
      tags:
      - cases
      operationId: updateCase
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasesController.UpdateCaseRequest"
        required: true
      responses:
        "200":
          description: updateCase 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
    delete:
      tags:
      - cases
      operationId: deleteCase
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Case deleted
        "404":
          description: Case not found
        "409":
          description: Records case with an import or activation running; wait for
            it to finish and retry
  /cases/{caseId}/agent/actions:
    get:
      tags:
      - agent
      summary: List the agent actions of a case
      description: "The case inbox: actions the agent proposed that need a person's\
        \ confirmation, newest first. Pending actions past their expiry read as expired."
      operationId: listCaseAgentActions
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        schema:
          type:
          - string
          - "null"
      - name: limit
        in: query
        schema:
          type:
          - integer
          - "null"
          format: int32
      - name: before
        in: query
        schema:
          type:
          - integer
          - "null"
          format: int64
      responses:
        "400":
          description: Unknown status or invalid limit
        "404":
          description: Case not found
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingActionList"
  /cases/{caseId}/agent/runs:
    get:
      tags:
      - agent
      summary: "List the agent runs of a case, newest first"
      description: "Items have the same shape as the single run GET. Follow the continuation\
        \ to read older runs. Filter by the classify job a run was started from, or\
        \ by status."
      operationId: listCaseAgentRuns
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: "Page size, 1 to 200 (default 50)"
        required: true
        schema:
          type: integer
          format: int32
          default: 50
      - name: continuation
        in: query
        description: Token from the previous page
        schema:
          type:
          - string
          - "null"
      - name: originJobId
        in: query
        description: Only runs started from this classify job
        schema:
          type:
          - integer
          - "null"
          format: int64
      - name: status
        in: query
        description: "Only runs in this status: QUEUED, RUNNING, COMPLETED, FAILED\
          \ or CANCELLED"
        schema:
          type:
          - string
          - "null"
      responses:
        "400":
          description: "Invalid limit, continuation or status"
        "404":
          description: Case not found
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunPage"
    post:
      tags:
      - agent
      summary: Start a headless agent run
      description: "Runs the case agent without a person present, as the person who\
        \ starts it. Every turn is bounded; the run continues in further turns until\
        \ it has investigated params.maxRows rows, used the budget or finished. Write\
        \ tools only create pending actions for a person to confirm; costly tools\
        \ run only inside the budget. Completion fires the organisation webhook. Agent\
        \ tokens cannot start runs."
      operationId: startCaseAgentRun
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAgentRunRequest"
        required: true
      responses:
        "400":
          description: "Unknown playbook, missing goal or job, or invalid params or\
            \ budget"
        "403":
          description: An agent token cannot start a run
        "404":
          description: Case not found
        "503":
          description: The run could not be queued; retry
        "202":
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunAccepted"
  /cases/{caseId}/agent/runs/{runId}:
    get:
      tags:
      - agent
      summary: Get the state and report of an agent run
      operationId: getCaseAgentRun
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: runId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Case or run not found
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunStatusResponse"
  /cases/{caseId}/agent/runs/{runId}/cancel:
    post:
      tags:
      - agent
      summary: Cancel an agent run
      description: Stops the run after its current turn. Idempotent for a cancelled
        run; answers 409 for a run that already finished. Agent tokens cannot cancel
        runs.
      operationId: cancelCaseAgentRun
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: runId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type:
              - array
              - "null"
              items:
                type: string
                format: byte
        required: true
      responses:
        "403":
          description: An agent token cannot cancel a run
        "404":
          description: Case or run not found
        "409":
          description: The run already finished
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunStatusResponse"
  /cases/{caseId}/agent/runs/{runId}/report:
    put:
      tags:
      - agent
      summary: Save the report of an agent run
      description: Only the agent of that run can save it. Proposals and questions
        accumulate over the turns of the run; the summary is replaced.
      operationId: putCaseAgentRunReport
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: runId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAgentRunReportRequest"
        required: true
      responses:
        "400":
          description: Invalid report
        "403":
          description: The caller is not the agent of this run
        "404":
          description: Case or run not found
        "409":
          description: The run already finished
        "200":
          description: Report saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
  /cases/{caseId}/classify:
    get:
      tags:
      - case-classify
      summary: "List the classify jobs of a case, newest first"
      description: Items have the same shape as the single job GET. Follow the continuation
        to read older jobs.
      operationId: listCaseClassify
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: "Page size, 1 to 200 (default 50)"
        required: true
        schema:
          type: integer
          format: int32
          default: 50
      - name: continuation
        in: query
        description: Token from the previous page
        schema:
          type:
          - string
          - "null"
      responses:
        "400":
          description: Invalid limit or continuation
        "404":
          description: Case not found
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyJobPage"
    post:
      tags:
      - case-classify
      summary: Start a classify job
      description: "Send inline rows (at most 1,000 rows or 10 MB), rows.source upload\
        \ (then upload the file to the returned uploadUrl and call commit), or record\
        \ keys of the knowledge base (at most 10,000). The tree, memo and records\
        \ table versions are pinned when the job starts."
      operationId: startCaseClassify
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifyStartRequest"
        required: true
      responses:
        "400":
          description: "Invalid rows, keys or config"
        "404":
          description: "Case, knowledge base or tree version not found"
        "409":
          description: "No dataset, imported records or usable tree"
        "413":
          description: "Too many rows or keys, or body over 10 MB"
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyAccepted"
  /cases/{caseId}/classify/{jobId}:
    get:
      tags:
      - case-classify
      summary: "Get the status, counts, usage and pinned versions of a classify job"
      operationId: getCaseClassify
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: jobId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Job not found
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyStatusResponse"
  /cases/{caseId}/classify/{jobId}/cancel:
    post:
      tags:
      - case-classify
      summary: Cancel a classify job
      description: Takes effect at the next chunk boundary. Idempotent.
      operationId: cancelCaseClassify
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: jobId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Job not found
        "409":
          description: Job already finished
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyStatusResponse"
  /cases/{caseId}/classify/{jobId}/commit:
    post:
      tags:
      - case-classify
      summary: Finish a classify job whose file was uploaded
      description: "Idempotent: committing a queued job returns it unchanged."
      operationId: commitCaseClassify
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: jobId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Job not found
        "409":
          description: "No file uploaded, upload window expired, or job failed"
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyAccepted"
  /cases/{caseId}/classify/{jobId}/results:
    get:
      tags:
      - case-classify
      summary: Page and filter the results of a classify job
      description: "Review requirement is computed from the stored flags and the job\
        \ routing rule, or from the routing override, so rules can change without\
        \ a rerun. A running job returns the rows written so far with complete=false.\
        \ Filtered scans cover at most 50,000 rows per request; follow the continuation\
        \ to go on."
      operationId: getCaseClassifyResults
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: jobId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: flag
        in: query
        description: Rows with this flag set
        schema:
          type:
          - string
          - "null"
      - name: reviewRequired
        in: query
        description: Rows whose computed review requirement equals this value
        schema:
          type:
          - boolean
          - "null"
      - name: level
        in: query
        description: "Tree level; with code, matches the chosen code at that level"
        schema:
          type:
          - integer
          - "null"
          format: int32
      - name: code
        in: query
        description: "Chosen code, at the given level when level is set"
        schema:
          type:
          - string
          - "null"
      - name: decision
        in: query
        description: "accept, correct, feedback or none"
        schema:
          type:
          - string
          - "null"
      - name: limit
        in: query
        description: "Page size, 1 to 1000 (default 100)"
        required: true
        schema:
          type: integer
          format: int32
          default: 100
      - name: continuation
        in: query
        description: Token from the previous page
        schema:
          type:
          - string
          - "null"
      - name: routing
        in: query
        description: "Comma separated flags that route a row to review, overriding\
          \ the job rule"
        schema:
          type:
          - string
          - "null"
      responses:
        "400":
          description: "Unknown flag, decision or routing flag, invalid limit or continuation"
        "404":
          description: Job not found
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyResultsPage"
  /cases/{caseId}/classify/{jobId}/results.csv:
    get:
      tags:
      - case-classify
      summary: Export classify results as CSV
      description: "Streams one row per result with input columns, code and path per\
        \ target level, flags, alternative, evidence keys, memo version and review\
        \ state. Cells starting with =, +, -, @ or a tab are prefixed with an apostrophe.\
        \ Accepts the same filters and routing override as the results endpoint."
      operationId: exportCaseClassifyResultsCsv
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: jobId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: flag
        in: query
        schema:
          type:
          - string
          - "null"
      - name: reviewRequired
        in: query
        schema:
          type:
          - boolean
          - "null"
      - name: level
        in: query
        schema:
          type:
          - integer
          - "null"
          format: int32
      - name: code
        in: query
        schema:
          type:
          - string
          - "null"
      - name: decision
        in: query
        schema:
          type:
          - string
          - "null"
      - name: routing
        in: query
        schema:
          type:
          - string
          - "null"
      responses:
        "404":
          description: Job not found
        "200":
          description: Ok
          content:
            text/csv:
              schema: {}
  /cases/{caseId}/classify/{jobId}/results/{rowId}:
    get:
      tags:
      - case-classify
      summary: Read one result row of a classify job
      description: Returns the stored row with the same review overlay as the results
        page and without diagnostics. evidenceKeys name the records the row was decided
        on.
      operationId: getCaseClassifyResultRow
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: jobId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: rowId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Job or row not found
        "200":
          description: Ok
          content:
            application/json:
              schema:
                additionalProperties: true
  /cases/{caseId}/classify/{jobId}/reviews:
    post:
      tags:
      - case-classify
      summary: "Accept, correct or comment on one classify result"
      description: "accept confirms the chosen code and correct supplies the right\
        \ one; both write the record label with labelSource review in the knowledge\
        \ base and take effect directly, so the product becomes evidence for later\
        \ runs. A correction also adds a correction memo entry. feedback only stores\
        \ a memo entry and never changes classification. Model proposals are never\
        \ written back. Rows without a key and matching jobs record the review and\
        \ memo entry but no record. The label write is asynchronous: labelWrite reports\
        \ its state, and a repeated identical request returns the same review. Requests\
        \ carrying the agent actor marker may only leave feedback."
      operationId: reviewCaseClassifyResult
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: jobId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifyReviewRequest"
        required: true
      responses:
        "400":
          description: "Unknown decision, a declined or failed row accepted, or a\
            \ code that is not an active category"
        "403":
          description: The request carries the agent actor marker and asks to accept
            or correct
        "404":
          description: Job or result row not found
        "409":
          description: The row cannot be written as a record
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyReviewResponse"
  /cases/{caseId}/dataset:
    get:
      tags:
      - case-records
      summary: Get the records dataset configuration of a case
      operationId: getCaseDataset
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Case not found or dataset not configured
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetConfigResponse"
    put:
      tags:
      - case-records
      summary: Configure the records dataset of a case
      description: Valid only on a case without documents. A change to the embedded
        text of a dataset that already holds records is refused with 409 unless reindex=true.
      operationId: putCaseDataset
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: reindex
        in: query
        description: Confirm that the embedded text of existing records will be re-embedded
        schema:
          type:
          - boolean
          - "null"
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetConfigRequest"
        required: true
      responses:
        "400":
          description: Invalid mapping or index settings
        "404":
          description: Case not found
        "409":
          description: "Case has documents, or the change requires a reindex"
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetConfigResponse"
  /cases/{caseId}/documents:
    get:
      tags:
      - cases
      operationId: listCaseDocuments
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: true
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: true
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: listCaseDocuments 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page_CaseDocument_"
    post:
      tags:
      - cases
      operationId: uploadCaseDocument
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                document:
                  type: string
                  format: binary
                datasetType:
                  type:
                  - string
                  - "null"
              required:
              - document
            encoding:
              document:
                contentType: application/octet-stream
        required: true
      responses:
        "409":
          description: A records case does not accept documents; import records instead
        "201":
          description: Document uploaded successfully
  /cases/{caseId}/documents/{documentId}:
    get:
      tags:
      - cases
      operationId: getCaseDocument
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: documentId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: getCaseDocument 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDocument"
    delete:
      tags:
      - cases
