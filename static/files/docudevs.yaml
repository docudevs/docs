          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseEmbeddingStatusDto"
  /cases/{caseId}/embedding-reindex:
    post:
      tags:
      - Embedding Generations
      operationId: reindexCaseEmbeddings
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: reindexCaseEmbeddings 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingGenerationDto"
    delete:
      tags:
      - Embedding Generations
      operationId: cancelCaseEmbeddingReindex
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: cancelCaseEmbeddingReindex 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingGenerationDto"
  /cases/{caseId}/embedding-reindex/retry:
    post:
      tags:
      - Embedding Generations
      operationId: retryCaseEmbeddingReindex
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: retryCaseEmbeddingReindex 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingGenerationDto"
  /cases/{caseId}/evals/holdout:
    post:
      tags:
      - case-evals
      summary: Start a holdout evaluation
      description: "Holds out a grouped sample of the labelled records, classifies\
        \ it once per variant with the held-out records left out of the evidence,\
        \ and scores each variant against the historical labels. The first variant\
        \ is compared with the others. The result is evidence for a reviewer, not\
        \ a gate."
      operationId: startCaseHoldoutEval
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalHoldoutRequest"
        required: true
      responses:
        "400":
          description: "Invalid sample, variants or config"
        "404":
          description: Case not found
        "409":
          description: "No dataset, imported records or usable tree"
        "202":
          description: Evaluation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalAccepted"
  /cases/{caseId}/evals/{evalId}:
    get:
      tags:
      - case-evals
      summary: Get the status and report of an evaluation
      operationId: getCaseEval
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: evalId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Case or evaluation not found
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalStatusResponse"
  /cases/{caseId}/evals:compare:
    post:
      tags:
      - case-evals
      summary: Score two completed evaluations against each other
      description: Scores only; nothing is classified again. Answers 409 when the
        evaluations were run on different samples or trees or are not completed.
      operationId: compareCaseEvals
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalCompareRequest"
        required: true
      responses:
        "400":
          description: Unknown variant
        "404":
          description: Case or evaluation not found
        "409":
          description: "Samples differ, or an evaluation is not completed"
        "202":
          description: Comparison accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalAccepted"
  /cases/{caseId}/memo:
    get:
      tags:
      - case-memo
      summary: List the memo entries of a case
      description: Returns the latest revision of every entry. version= returns the
        snapshot at that memo version.
      operationId: listCaseMemo
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: type
        in: query
        schema:
          type:
          - string
          - "null"
      - name: scope
        in: query
        schema:
          type:
          - string
          - "null"
      - name: status
        in: query
        schema:
          type:
          - string
          - "null"
      - name: version
        in: query
        schema:
          type:
          - integer
          - "null"
          format: int64
      responses:
        "400":
          description: "Unknown type, scope or status filter"
        "404":
          description: Case not found
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoList"
  /cases/{caseId}/memo/entries:
    post:
      tags:
      - case-memo
      summary: Create a memo entry
      description: An instruction starts as proposed and becomes active only through
        approval. Feedback is stored active and does not change classification.
      operationId: createCaseMemoEntry
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoEntryRequest"
        required: true
      responses:
        "400":
          description: "Invalid type, scope or text"
        "404":
          description: Case not found
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoEntryAck"
  /cases/{caseId}/memo/entries/{entryId}/approve:
    post:
      tags:
      - case-memo
      summary: Approve a proposed instruction (human only)
      operationId: approveCaseMemoEntry
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: entryId
        in: path
        required: true
        schema:
          type: string
      responses:
        "403":
          description: The request carries the agent actor marker
        "404":
          description: Case or entry not found
        "409":
          description: Entry is not a proposed instruction
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoEntryAck"
  /cases/{caseId}/memo/entries/{entryId}/evaluate:
    post:
      tags:
      - case-evals
      summary: Evaluate a proposed memo instruction before approving it
      description: Runs a holdout evaluation of the active memo (A) against the active
        memo plus the proposed entry (B). The result is evidence; approval stays a
        human decision.
      operationId: evaluateCaseMemoEntry
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: entryId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalMemoRequest"
        required: false
      responses:
        "404":
          description: Case or entry not found
        "409":
          description: The entry is not a proposed instruction
        "202":
          description: Evaluation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalAccepted"
  /cases/{caseId}/memo/entries/{entryId}/retire:
    post:
      tags:
      - case-memo
      summary: Retire a memo entry with a new revision
      operationId: retireCaseMemoEntry
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: entryId
        in: path
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Case or entry not found
        "409":
          description: Entry is already retired
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoEntryAck"
  /cases/{caseId}/memo/entries/{entryId}/revisions:
    get:
      tags:
      - case-memo
      summary: List every revision of a memo entry
      operationId: listCaseMemoEntryRevisions
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: entryId
        in: path
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Case or entry not found
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoRevisionList"
  /cases/{caseId}/records:
    get:
      tags:
      - case-records
      summary: "Page through records, filtered by label, subtree, label source and\
        \ attributes"
      description: "Records are ordered by key. Paging uses an opaque continuation\
        \ token that resumes after the last returned key, so there is no depth limit."
      operationId: listCaseRecords
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: label
        in: query
        schema:
          type:
          - string
          - "null"
      - name: subtree
        in: query
        schema:
          type:
          - string
          - "null"
      - name: labelSource
        in: query
        schema:
          type:
          - string
          - "null"
      - name: attribute
        in: query
        schema:
          type:
          - array
          - "null"
          items:
            type: string
      - name: limit
        in: query
        schema:
          type:
          - integer
          - "null"
          format: int32
      - name: continuation
        in: query
        schema:
          type:
          - string
          - "null"
      responses:
        "400":
          description: "Invalid filter, limit, or continuation"
        "404":
          description: Case not found
        "409":
          description: Case has no records dataset or no active embedding generation
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordListResponse"
  /cases/{caseId}/records/imports:
    get:
      tags:
      - case-records
      summary: "List the imports of a case, newest first"
      description: "Items have the same shape as the single import GET, except that\
        \ syncSummary is only returned by the single GET."
      operationId: listCaseRecordImports
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: "Page size, 1 to 200 (default 50)"
        required: true
        schema:
          type: integer
          format: int32
          default: 50
      - name: continuation
        in: query
        description: Token from the previous page
        schema:
          type:
          - string
          - "null"
      responses:
        "400":
          description: Invalid limit or continuation
        "404":
          description: Case not found
        "409":
          description: Case has no records dataset
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordImportPage"
    post:
      tags:
      - case-records
      summary: Start a file import or snapshot sync
      description: "Without sourceUrl the response carries a write-only uploadUrl\
        \ for one staging blob; upload the file as a block blob, then call commit."
      operationId: createCaseRecordImport
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordImportRequest"
        required: true
      responses:
        "400":
          description: Invalid options or sourceUrl
        "503":
          description: Upload URLs are unavailable
        "202":
          description: Import created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordImportResponse"
  /cases/{caseId}/records/imports/{importId}:
    get:
      tags:
      - case-records
      summary: Get the status of an import
      operationId: getCaseRecordImport
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: importId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Import not found
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordImportStatusResponse"
  /cases/{caseId}/records/imports/{importId}/commit:
    post:
      tags:
      - case-records
      summary: Finish an import whose file was uploaded
      description: "Idempotent: committing an import that is already queued returns\
        \ it unchanged."
      operationId: commitCaseRecordImport
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: importId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Import not found
        "409":
          description: "No file uploaded, upload window expired, or import failed"
        "202":
          description: Import queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordImportResponse"
  /cases/{caseId}/records/imports/{importId}/retry:
    post:
      tags:
      - case-records
      summary: Retry a failed import
      description: Queues the failed import again with a new job. The worker resumes
        from its saved progress and does not re-apply table changes that were already
        merged. Staged input is kept for 7 days after a failure.
      operationId: retryCaseRecordImport
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: importId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Import not found
        "409":
          description: "Import has not failed, is retried by the system, or its staged\
            \ input is gone or changed"
        "503":
          description: The import could not be queued
        "202":
          description: Import queued again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordImportResponse"
  /cases/{caseId}/records/stats:
    get:
      tags:
      - case-records
      summary: Per-label record counts of the latest applied table version
      operationId: getCaseRecordStats
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Case not found
        "409":
          description: Case has no records dataset
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordsStatsResponse"
  /cases/{caseId}/records/{key}:
    get:
      tags:
      - case-records
      summary: "Get one record with its label, label source and index state"
      operationId: getCaseRecord
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Case or record not found
        "409":
          description: Case has no records dataset or no active embedding generation
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordResponse"
    put:
      tags:
      - case-records
      summary: Upsert one record
      description: "Writes are asynchronous: the body is staged and a worker applies\
        \ it. Poll the returned job or import."
      operationId: putCaseRecord
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordUpsertBody"
        required: true
      responses:
        "400":
          description: Blank key or missing text
        "404":
          description: Case not found
        "409":
          description: Case has no records dataset
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordImportAccepted"
    delete:
      tags:
      - case-records
      summary: Delete one record
      operationId: deleteCaseRecord
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "400":
          description: Blank key
        "404":
          description: Case not found
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordImportAccepted"
  /cases/{caseId}/records:batch:
    post:
      tags:
      - case-records
      summary: "Upsert and delete up to 1,000 records or 10 MB in one call"
      operationId: batchCaseRecords
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordBatchRequest"
        required: true
      responses:
        "400":
          description: Invalid batch
        "413":
          description: "More than 1,000 records or 10 MB; use a file import"
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordImportAccepted"
  /cases/{caseId}/search:
    post:
      tags:
      - case-records
      summary: Search the records or the documents of a case
      description: Embeds the query with the case's active embedding provider and
        searches the shared index in one call. kind=records searches a records dataset
        with the tier-1 settings; kind=documents searches case documents.
      operationId: searchCase
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseSearchRequest"
        required: true
      responses:
        "400":
          description: "Invalid kind, query, filters, or settings outside the limits"
        "404":
          description: Case not found
        "409":
          description: "Kind does not match the case, or the records case has no active\
            \ embedding generation"
        "502":
          description: "Embedding provider, dimension check, or search index failed"
        "503":
          description: Search is not configured or model credentials are not ready
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseSearchResponse"
  /cases/{caseId}/summaries:
    get:
      tags:
      - cases
      operationId: listCaseSummaries
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: All document summaries for the case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummaryResponse"
  /cases/{caseId}/trees:
    get:
      tags:
      - case-records
      summary: "List the tree versions of a case, newest first"
      operationId: listCaseTrees
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Case not found
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeVersionList"
    post:
      tags:
      - case-records
      summary: Upload a category tree as a new draft version
      description: Each upload creates a new immutable version stored as one blob.
        Activation is a separate step.
      operationId: createCaseTree
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreeCreateRequest"
        required: true
      responses:
        "400":
          description: Validation problems; nothing is stored
        "404":
          description: Case not found
        "201":
          description: Draft version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeCreateResponse"
  /cases/{caseId}/trees/{versionId}/activate:
    post:
      tags:
      - case-records
      summary: Activate a tree version
      description: "Starts a processing job that validates every record label against\
        \ the version, applies the successor mapping, embeds the category texts and\
        \ re-derives the label paths. The active pointer moves only when the job succeeds;\
        \ poll GET /job/status/{guid}. The job report lists valid, retired and missing\
        \ codes with counts."
      operationId: activateCaseTree
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: versionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreeActivationRequest"
      responses:
        "400":
          description: Invalid successor mapping
        "404":
          description: Case or version not found
        "409":
          description: "The version is already active, or another activation is running"
        "202":
          description: Activation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeActivationAccepted"
  /cases/{caseId}/trees/{versionId}/activations/{importId}/report:
    get:
      tags:
      - case-records
      summary: Read the report of a tree activation
      description: "Returns the worker report of an activation: counts of valid, retired\
        \ and missing record labels, successor rewrites, codes without a successor,\
        \ and memo entries whose scope names categories that are not valid in the\
        \ version. importId is the id of the activation in GET /cases/{caseId}/records/imports,\
        \ matched by the jobGuid returned when it was accepted."
      operationId: getCaseTreeActivationReport
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: versionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: importId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: "The activation does not exist for this tree version, or its\
            \ report has not been written yet"
  /cases/{caseId}/trees/{versionId}/nodes:
    get:
      tags:
      - case-records
      summary: Browse or search the nodes of a tree version
      description: "Without parent and q the roots are returned. With parent, its\
        \ children. q matches name or code case-insensitively among those children,\
        \ or across the whole tree when parent is absent."
      operationId: browseCaseTreeNodes
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: versionId
        in: path
