openapi: 3.1.0
info:
  title: DocuDevs API
  description: DocuDevs Document processing API. Easiest way to convert your documents
    to data
  version: 1.3.0
paths:
  /agent/chat:
    post:
      tags:
      - agent
      operationId: chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentChatRequest"
        required: true
      responses:
        "200":
          description: chat 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentChatResponse"
  /agent/status/{jobGuid}:
    get:
      tags:
      - agent
      operationId: getAgentStatus
      parameters:
      - name: jobGuid
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: getAgentStatus 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatusResponse"
  /billing/balance:
    get:
      tags:
      - billing
      operationId: getBalance
      responses:
        "200":
          description: getBalance 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingBalanceResponse"
  /billing/checkout:
    post:
      tags:
      - billing
      operationId: createCheckoutSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCheckoutRequest"
        required: true
      responses:
        "200":
          description: createCheckoutSession 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCheckoutResponse"
  /billing/prices:
    get:
      tags:
      - billing
      operationId: listPrices
      responses:
        "200":
          description: listPrices 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillingPrice"
  /billing/usage/by-jobs:
    get:
      tags:
      - billing
      operationId: getUsageByJobs
      parameters:
      - name: guids
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: getUsageByJobs 200 response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: integer
                  format: int64
  /billing/usage/events:
    get:
      tags:
      - billing
      operationId: getUsageEvents
      parameters:
      - name: guids
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: true
        schema:
          type: integer
          format: int32
          default: 500
      - name: includeRelated
        in: query
        required: true
        schema:
          type: boolean
          default: true
      responses:
        "200":
          description: getUsageEvents 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsageEventResponse"
  /billing/usage/ledger:
    get:
      tags:
      - billing
      operationId: getRecentLedger
      parameters:
      - name: limit
        in: query
        required: true
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          description: getRecentLedger 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerEntryResponse"
  /billing/usage/summary:
    get:
      tags:
      - billing
      operationId: getUsageSummary
      responses:
        "200":
          description: getUsageSummary 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummaryResponse"
  /billing/webhook:
    post:
      tags:
      - billing
      operationId: handleWebhook
      parameters:
      - name: Stripe-Signature
        in: header
        schema:
          type:
          - string
          - "null"
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: handleWebhook 200 response
          content:
            application/json:
              schema:
                type: string
  /cases:
    get:
      tags:
      - cases
      operationId: listCases
      responses:
        "200":
          description: listCases 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Case"
    post:
      tags:
      - cases
      operationId: createCase
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasesController.CreateCaseRequest"
        required: true
      responses:
        "201":
          description: Case created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
  /cases/{caseId}:
    get:
      tags:
      - cases
      operationId: getCase
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: getCase 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
    put:
      tags:
      - cases
      operationId: updateCase
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasesController.UpdateCaseRequest"
        required: true
      responses:
        "200":
          description: updateCase 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
    delete:
      tags:
      - cases
      operationId: deleteCase
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: deleteCase 200 response
  /cases/{caseId}/documents:
    get:
      tags:
      - cases
      operationId: listCaseDocuments
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: true
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: true
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: listCaseDocuments 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page_CaseDocument_"
    post:
      tags:
      - cases
      operationId: uploadCaseDocument
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                document:
                  type: string
                  format: binary
              required:
              - document
            encoding:
              document:
                contentType: application/octet-stream
        required: true
      responses:
        "201":
          description: Document uploaded successfully
  /cases/{caseId}/documents/{documentId}:
    get:
      tags:
      - cases
      operationId: getCaseDocument
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: documentId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: getCaseDocument 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDocument"
    delete:
      tags:
      - cases
      operationId: deleteCaseDocument
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: documentId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: deleteCaseDocument 200 response
  /cases/{caseId}/documents/{documentId}/download:
    get:
      tags:
      - cases
      operationId: downloadCaseDocument
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: documentId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: downloadCaseDocument 200 response
          content:
            application/json:
              schema:
                type: string
                format: binary
  /cases/{caseId}/documents/{documentId}/summary:
    get:
      tags:
      - cases
      operationId: getDocumentSummary
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: documentId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Document summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummaryResponse"
  /cases/{caseId}/summaries:
    get:
      tags:
      - cases
      operationId: listCaseSummaries
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: All document summaries for the case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummaryResponse"
  /cases/{caseId}/upload:
    post:
      tags:
      - cases
      operationId: uploadCaseDocumentLegacy
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                document:
                  type: string
                  format: binary
              required:
              - document
            encoding:
              document:
                contentType: application/octet-stream
        required: true
      responses:
        "200":
          description: uploadCaseDocumentLegacy 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
      deprecated: true
  /configuration:
    get:
      tags:
      - configuration
      operationId: listConfigurations
      responses:
        "200":
          description: listConfigurations 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NamedConfiguration"
  /configuration/{name}:
    get:
      tags:
      - configuration
      operationId: getConfiguration
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: getConfiguration 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadCommand"
    post:
      tags:
      - configuration
      operationId: saveConfiguration
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCommand"
        required: true
      responses:
        "200":
          description: saveConfiguration 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamedConfiguration"
    delete:
      tags:
      - configuration
      operationId: deleteConfiguration
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: deleteConfiguration 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
  /configuration/{name}/excel-template:
    get:
      tags:
      - configuration
      operationId: downloadExcelTemplate
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: downloadExcelTemplate 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: byte
    post:
      tags:
      - configuration
      operationId: uploadExcelTemplate
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
            encoding:
              file:
                contentType: application/octet-stream
        required: true
      responses:
        "200":
          description: uploadExcelTemplate 200 response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
  /configuration/{name}/lookup-file:
    get:
      tags:
      - configuration
      operationId: downloadLookupFile
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: downloadLookupFile 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: byte
    post:
      tags:
      - configuration
      operationId: uploadLookupFile
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
            encoding:
              file:
                contentType: application/octet-stream
        required: true
      responses:
        "200":
          description: uploadLookupFile 200 response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
    delete:
      tags:
      - configuration
      operationId: deleteLookupFile
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: deleteLookupFile 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
  /document/acroform-metadata:
    post:
      tags:
      - document
      operationId: extractAcroFormMetadata
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                document:
                  type: string
                  format: binary
              required:
              - document
            encoding:
              document:
                contentType: application/octet-stream
        required: true
      responses:
        "200":
          description: extractAcroFormMetadata 200 response
          content:
            application/json:
              schema:
                additionalProperties: true
  /document/analyze:
    post:
      tags:
      - document
      operationId: analyzeDocument
      parameters:
      - name: ocr
        in: query
        schema:
          type:
          - string
          - "null"
      - name: describeFigures
        in: query
        schema:
          type:
          - boolean
          - "null"
      - name: extractFigures
        in: query
        schema:
          type:
          - boolean
          - "null"
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                document:
                  type: string
                  format: binary
              required:
              - document
            encoding:
              document:
                contentType: application/octet-stream
        required: true
      responses:
        "200":
          description: analyzeDocument 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
  /document/batch:
    post:
      tags:
      - batch
      operationId: createBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateRequest"
      responses:
        "200":
          description: createBatch 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCreateResponse"
  /document/batch/{guid}/lookup-file:
    get:
      tags:
      - batch
      operationId: downloadBatchLookupFile
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: downloadBatchLookupFile 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: byte
    post:
      tags:
      - batch
      operationId: uploadBatchLookupFile
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
            encoding:
              file:
                contentType: application/octet-stream
        required: true
      responses:
        "200":
          description: uploadBatchLookupFile 200 response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
    delete:
      tags:
      - batch
      operationId: deleteBatchLookupFile
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: deleteBatchLookupFile 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
  /document/batch/{guid}/process:
    post:
      tags:
      - batch
      operationId: processBatch
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCommand"
      responses:
        "200":
          description: processBatch 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCreateResponse"
  /document/batch/{guid}/process/with-configuration/{configurationName}:
    post:
      tags:
      - batch
      operationId: processBatchWithConfiguration
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
      - name: configurationName
        in: path
        required: true
        schema:
          type: string
      - name: trace
        in: query
        schema:
          type:
          - boolean
          - "null"
      responses:
        "200":
          description: processBatchWithConfiguration 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCreateResponse"
  /document/batch/{guid}/schedule:
    post:
      tags:
      - batch
      operationId: scheduleBatch
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: scheduleBatch 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchScheduleResponse"
  /document/batch/{guid}/upload:
    post:
      tags:
      - batch
      operationId: uploadBatchDocument
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                document:
                  type: string
                  format: binary
              required:
              - document
            encoding:
              document:
                contentType: application/octet-stream
        required: true
      responses:
        "200":
          description: uploadBatchDocument 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchUploadResponse"
  /document/generate-schema:
    post:
      tags:
      - document
      operationId: generateSchema
      parameters:
      - name: instructionsText
        in: query
        schema:
          type:
          - string
          - "null"
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                document:
                  type: string
                  format: binary
                instructions:
                  type:
                  - string
                  - "null"
                  format: binary
              required:
              - document
            encoding:
              instructions:
                contentType: application/octet-stream
              document:
                contentType: application/octet-stream
        required: true
      responses:
        "200":
          description: generateSchema 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
  /document/ocr/sync:
    post:
      tags:
      - document
      operationId: ocrDocumentSync
      parameters:
      - name: format
        in: query
        schema:
          type:
          - string
          - "null"
      - name: ocr
        in: query
        schema:
          type:
          - string
          - "null"
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                document:
                  type: string
                  format: binary
              required:
              - document
            encoding:
              document:
                contentType: application/octet-stream
        required: true
      responses:
        "200":
          description: ocrDocumentSync 200 response
          content:
            application/json:
              schema:
                type: string
  /document/ocr/{guid}:
    post:
      tags:
      - document
      operationId: ocrDocument
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
      - name: format
        in: query
        schema:
          type:
          - string
          - "null"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OcrCommand"
      responses:
        "200":
          description: ocrDocument 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
  /document/process/{guid}:
    post:
      tags:
      - document
      operationId: processDocument
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
      - name: dependsOn
        in: query
        schema:
          type:
          - string
          - "null"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCommand"
      responses:
        "200":
          description: processDocument 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
  /document/process/{guid}/with-configuration/{configurationName}:
    post:
      tags:
      - document
      operationId: processDocumentWithConfiguration
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
      - name: configurationName
        in: path
        required: true
        schema:
          type: string
      - name: dependsOn
        in: query
        schema:
          type:
          - string
          - "null"
      responses:
        "200":
          description: processDocumentWithConfiguration 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
  /document/track-changes:
    post:
      tags:
      - track-changes
      summary: "Extract tracked changes (insertions, deletions) and comments from\
        \ a Word document."
      description: "Extract tracked changes (insertions, deletions) and comments from\
        \ a Word document. Supports .docx files only. Returns structured data with\
        \ author and date metadata."
      operationId: extractTrackChanges
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                document:
                  type: string
                  format: binary
              required:
              - document
            encoding:
              document:
                contentType: application/octet-stream
        required: true
      responses:
        "200":
          description: extractTrackChanges 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackChangesResult"
  /document/upload:
    post:
      tags:
      - document
      operationId: uploadDocument
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                document:
                  type: string
                  format: binary
              required:
              - document
            encoding:
              document:
                contentType: application/octet-stream
        required: true
      responses:
        "200":
          description: uploadDocument 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
  /document/upload-files:
    post:
      tags:
      - document
      operationId: uploadFiles
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                metadata:
                  type:
                  - string
                  - "null"
                  format: binary
                document:
                  type: string
                  format: binary
                instructions:
                  type:
                  - string
                  - "null"
                  format: binary
                schema:
                  type:
                  - string
                  - "null"
                  format: binary
              required:
              - document
            encoding:
              schema:
                contentType: application/octet-stream
              instructions:
                contentType: application/octet-stream
              metadata:
                contentType: application/octet-stream
              document:
                contentType: application/octet-stream
        required: true
      responses:
        "200":
          description: uploadFiles 200 response
          content:
            application/json:
